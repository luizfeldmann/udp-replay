name: Build

on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
      build_type:
        required: true
        type: string
      runs-on:
        required: true
        type: string
      container_image:
        required: true
        type: string
      package_manager:
        required: true
        type: string

jobs:
  build:
    name: Build for ${{ inputs.profile }}
    runs-on: ${{ inputs.runs-on }}
    container:
      image: ${{ inputs.container_image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install system dependencies (APT)
        if: ${{ inputs.package_manager == 'apt' }}
        run: |
          apt-get update
          apt-get install -y \
            git \
            build-essential \
            cmake \
            python3 \
            python3-pip \
            python3-venv

      - name: Install system dependencies (APK)
        if: ${{ inputs.package_manager == 'apk' }}
        run: |
          apk add --no-cache \
            git \
            build-base \
            flex \
            bison \
            m4 \
            linux-headers \
            cmake \
            python3 \
            py3-pip

      - name: Setup Python venv
        run: |
          python3 -m venv venv
          echo "$PWD/venv/bin" >> $GITHUB_PATH

      - name: Install Conan
        run: |
          pip install --upgrade pip
          pip install conan
          conan profile detect

      - name: Install dependencies
        run: |
          conan install . \
          --profile:host=profiles/${{ inputs.profile }} \
          --profile:build=profiles/${{ inputs.profile }} \
          --build=missing \
          --build="b2/*"

      - name: Build
        run: |
          conan build . \
          --profile:host=profiles/${{ inputs.profile }} \
          --profile:build=profiles/${{ inputs.profile }}

      - name: Run unit tests
        run: |
          cd build/${{ inputs.build_type }}
          ctest --output-on-failure

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ inputs.profile }}
          retention-days: 1
          path: build/${{ inputs.build_type }}/udp-replay
