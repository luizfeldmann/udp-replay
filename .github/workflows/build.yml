name: Build

on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
      build_type:
        required: true
        type: string
      runs-on:
        required: true
        type: string

jobs:
  build:
    name: Build for ${{ inputs.profile }}
    runs-on: ${{ inputs.runs-on }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            python3 \
            python3-pip

      - name: Install Conan
        run: |
          pip3 install --upgrade pip
          pip3 install conan
          conan profile detect

      - name: Install dependencies
        run: |
          conan install . \
          --profile=profiles/${{ inputs.profile }} \
          --build=missing

      - name: Build
        run: |
          conan build . \
          --profile=profiles/${{ inputs.profile }}

      - name: Run unit tests
        run: |
          cd build/${{ inputs.build_type }}
          ctest --output-on-failure

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ inputs.profile }}
          retention-days: 1
          path: build/${{ inputs.build_type }}/udp-replay
